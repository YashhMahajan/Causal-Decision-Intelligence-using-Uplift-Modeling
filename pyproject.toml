[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-prep"
version = "0.2.0"
description = "Causal-safe, reproducible preprocessing for uplift / HTE modelling (Hillstrom, X5, Lenta)"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "pyarrow==25.0.1",
    "openpyxl==3.1.5",
    "matplotlib==3.11.1",
    "joblib==1.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
